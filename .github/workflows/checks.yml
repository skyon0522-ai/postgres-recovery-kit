name: Verify recovery source, interface and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOSUMDB: sum.golang.org
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: recovery-improvement/example/go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Verify raw source bytes and source modes
        run: python3 -B tools/verify_source.py --check-modes
      - name: Test Linux entrypoint and recorded-evidence boundaries
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build the copied Toxiproxy server
        working-directory: components/toxiproxy
        run: |
          go build -trimpath -o "$RUNNER_TEMP/toxiproxy-server" ./cmd/server
          go mod verify
      - name: Compile the recovery test without starting a database
        working-directory: recovery-improvement/example
        run: |
          go test -c -trimpath -o "$RUNNER_TEMP/recovery.test" .
          go mod verify
      - name: Verify source bytes remained unchanged
        run: python3 -B tools/verify_source.py --check-modes
